name: Controllo pack

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Un solo workflow alla volta per ramo: tutti possono fare commit
concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKWIZ_COMMIT: 170b22d785959dda5876b54b7f16e1b807a57fb6

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Installa packwiz
        run: |
          go install "github.com/packwiz/packwiz@${PACKWIZ_COMMIT}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Indice, controlli, inventario e controllo dei nomi
        id: checks
        run: |
          status=0
          for pack in */pack/pack.toml; do
            bash scripts/ci_pack.sh "$(dirname "$pack")" || status=1
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Salva indice, inventario e rapporto
        if: github.event_name != 'pull_request'
        run: |
          bash scripts/ci_commit.sh "chore: indice e inventario aggiornati [skip ci]"

      - name: Esito
        if: steps.checks.outputs.status != '0'
        run: |
          echo "Controlli falliti: vedi <versione>/data/inventario/controllo.md nel ramo"
          exit 1
