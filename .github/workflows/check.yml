name: Controllo pack

# Controlla e basta, senza commit: rifà indice (con packwiz), inventario e controllo dei nomi
# e fallisce se sono diversi da quelli del commit. Li scrive prima del push il controllo
# locale (bash scripts/controllo_locale.sh <pack>), con packwiz_index.py: packwiz qui
# fa da verifica indipendente.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Conta solo l'ultimo commit di un ramo
concurrency:
  group: controllo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/packwiz

      - name: Indice, controlli, inventario e controllo dei nomi
        id: checks
        run: |
          status=0
          for pack in */pack/pack.toml; do
            bash scripts/ci_pack.sh "$(dirname "$pack")" || status=1
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: File generati aggiornati nel commit
        run: |
          # shellcheck disable=SC2035
          cambiati=$(git status --porcelain -- */pack */data/inventario)
          if [ -n "$cambiati" ]; then
            echo "$cambiati"
            git --no-pager diff --stat
            echo "::error::Indice, inventario o controllo.md non sono aggiornati nel commit: lanciare bash scripts/controllo_locale.sh <pack> e fare un commit con i file cambiati"
            exit 1
          fi
          echo "Indice, inventario e controllo.md del commit sono aggiornati."

      - name: Esito
        if: always() && steps.checks.outputs.status != '0'
        run: |
          for r in */data/inventario/controllo.md; do sed -n '/^## Errori/,/^## Avvisi/p' "$r"; done
          echo "::error::Controlli falliti: il dettaglio è qui sopra e nel log del passo dei controlli"
          exit 1
