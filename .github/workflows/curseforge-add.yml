name: Aggiungi mod CurseForge

on:
  workflow_dispatch:
    inputs:
      pack:
        description: Cartella del pack
        required: true
        default: 1.21.1/pack
      urls:
        description: Link ai file esatti su CurseForge (…/files/<id>), separati da spazi
        required: true

permissions:
  contents: write

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKWIZ_COMMIT: 170b22d785959dda5876b54b7f16e1b807a57fb6

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Installa packwiz
        run: |
          go install "github.com/packwiz/packwiz@${PACKWIZ_COMMIT}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Aggiungi le mod
        env:
          PACK: ${{ inputs.pack }}
          URLS: ${{ inputs.urls }}
        run: |
          test -f "$PACK/pack.toml" || { echo "Pack non trovato: $PACK"; exit 1; }
          cd "$PACK"
          for url in $URLS; do
            echo "::group::$url"
            # "n": rifiuta le dipendenze proposte (sono già nel pack da Modrinth)
            printf 'n\nn\nn\n' | packwiz curseforge add "$url"
            echo "::endgroup::"
          done

      - name: Indice, controlli, inventario e controllo dei nomi
        id: checks
        env:
          PACK: ${{ inputs.pack }}
        run: |
          status=0
          bash scripts/ci_pack.sh "$PACK" || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Commit
        env:
          URLS: ${{ inputs.urls }}
        run: |
          bash scripts/ci_commit.sh "feat: mod CurseForge aggiunte da GitHub Actions" "$URLS"

      - name: Esito
        if: steps.checks.outputs.status != '0'
        run: |
          echo "Controlli falliti: vedi <versione>/data/inventario/controllo.md nel ramo"
          exit 1
