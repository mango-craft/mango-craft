name: Aggiungi mod CurseForge

on:
  workflow_dispatch:
    inputs:
      pack:
        description: Cartella del pack
        required: true
        default: 1.21.1/pack
      urls:
        description: Link ai file esatti su CurseForge (…/files/<id>), o al progetto per l'ultimo file compatibile; separati da spazi
        required: true

permissions:
  contents: write

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      # Le mod si aggiungono solo su dev: main riceve dev con un merge (AGENTS.md, sezione 5)
      - name: Solo sul ramo dev
        run: |
          if [ "$GITHUB_REF" != refs/heads/dev ]; then
            echo "::error::Le mod si aggiungono solo su dev (lanciato su $GITHUB_REF)"; exit 1
          fi

      # L'ultimo commit del ramo, non quello di quando il workflow è stato lanciato
      # (un workflow in coda partirebbe da un commit vecchio)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: ./.github/actions/packwiz

      - name: Aggiungi le mod
        id: add
        env:
          PACK: ${{ inputs.pack }}
          URLS: ${{ inputs.urls }}
        run: |
          test -f "$PACK/pack.toml" || { echo "Pack non trovato: $PACK"; exit 1; }
          # L'output di packwiz va in un file del repository: resta nel ramo accanto
          # a controllo.md, anche dopo che il log del workflow è scaduto
          LOG="$PWD/$(dirname "$PACK")/data/inventario/ultimo-workflow.log"
          mkdir -p "$(dirname "$LOG")"
          echo "Aggiungi mod CurseForge — $(date -u +%F)" > "$LOG"
          cd "$PACK"
          failed=0
          for url in $URLS; do
            echo "== $url" >> "$LOG"
            # "n": rifiuta le dipendenze proposte (sono già nel pack da Modrinth).
            # Un link al progetto (senza /files/<id>) prende l'ultimo file per MC e loader del pack
            if ! printf 'n\nn\nn\n' | packwiz curseforge add "$url" >> "$LOG" 2>&1; then
              echo "ERRORE: $url non aggiunta" >> "$LOG"
              failed=1
            fi
          done
          cat "$LOG"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Indice, controlli, inventario e controllo dei nomi
        id: checks
        env:
          PACK: ${{ inputs.pack }}
        run: |
          status=0
          bash scripts/ci_pack.sh "$PACK" || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Commit
        env:
          URLS: ${{ inputs.urls }}
        run: |
          bash scripts/ci_commit.sh "feat: mod CurseForge aggiunte da GitHub Actions" "$URLS"

      - name: Esito
        if: steps.checks.outputs.status != '0' || steps.add.outputs.failed != '0'
        run: |
          echo "Aggiunte non riuscite: vedi <versione>/data/inventario/ultimo-workflow.log"
          echo "Controlli falliti: vedi <versione>/data/inventario/controllo.md nel ramo"
          exit 1
