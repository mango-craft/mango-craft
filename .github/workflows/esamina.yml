name: Esamina mod

# Legge i .jar di mod che NON sono nel pack (versione, dipendenze, dati) per valutarle.
# Il risultato (<slug>.md per mod) è un artefatto del workflow, non un commit: lo stage è
# locale e fuori da git (ai-agents/README.md). Si scarica con
#   gh run download <id> -n esame-mod -D ai-agents/stage/<data>-esame-mod
# In locale si fa prima con python3 scripts/esamina.py (docs/0201-sviluppo.md).
on:
  workflow_dispatch:
    inputs:
      pack:
        description: Cartella del pack (serve per versione di Minecraft e loader)
        required: true
        default: 1.21.1/pack
      mods:
        description: "Mod da esaminare, separate da spazi: slug (ultima release), slug@versione o id di versione"
        required: true
      filtro:
        description: "Espressione regolare sui percorsi dei .json di cui elencare i valori (- = nessuno)"
        required: true
        default: "-"
      stringhe:
        description: "Espressione regolare sui testi del codice compilato (nomi di config, comandi; - = nessuno)"
        required: false
        default: "-"

permissions:
  contents: read

jobs:
  esamina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Esamina
        env:
          PACK: ${{ inputs.pack }}
          MODS: ${{ inputs.mods }}
          FILTRO: ${{ inputs.filtro }}
          STRINGHE: ${{ inputs.stringhe }}
        run: |
          # shellcheck disable=SC2086
          python3 scripts/esamina.py "$PACK" esame-mod "$FILTRO" --stringhe "${STRINGHE:--}" $MODS

      - name: Salva come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: esame-mod
          path: esame-mod/
          retention-days: 30
