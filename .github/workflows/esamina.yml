name: Esamina mod

# Legge i .jar di mod che NON sono nel pack (versione, dipendenze, dati) per valutarle.
# Il risultato va in ai-agents/stage/<data>_<MC>-v<versione del pack>_esame-mod/<slug>.md
# con un commit sul ramo scelto (materiale grezzo: non si modifica mai).
on:
  workflow_dispatch:
    inputs:
      pack:
        description: Cartella del pack (serve per versione di Minecraft e loader)
        required: true
        default: 1.21.1/pack
      mods:
        description: "Mod da esaminare, separate da spazi: slug (ultima release), slug@versione o id di versione"
        required: true
      filtro:
        description: "Espressione regolare sui percorsi dei .json di cui elencare i valori (- = nessuno)"
        required: true
        default: "-"
      stringhe:
        description: "Espressione regolare sui testi del codice compilato (nomi di config, comandi; - = nessuno)"
        required: false
        default: "-"

permissions:
  contents: write

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  esamina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Esamina
        env:
          PACK: ${{ inputs.pack }}
          MODS: ${{ inputs.mods }}
          FILTRO: ${{ inputs.filtro }}
          STRINGHE: ${{ inputs.stringhe }}
        run: |
          ver=$(python3 -c "import tomllib,sys;d=tomllib.load(open(sys.argv[1],'rb'));print(d['versions']['minecraft']+'-v'+d['version'])" "$PACK/pack.toml")
          out="ai-agents/stage/$(date -u +%F)_${ver}_esame-mod"
          # shellcheck disable=SC2086
          python3 scripts/esamina.py "$PACK" "$out" "$FILTRO" --stringhe "${STRINGHE:--}" $MODS

      - name: Salva
        env:
          MODS: ${{ inputs.mods }}
        run: |
          bash scripts/ci_commit.sh "chore: esame di mod fuori dal pack (stage) [skip ci]" "Esaminate: $MODS"
