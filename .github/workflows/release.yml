name: Release

on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da creare sull'ultimo commit di main e rilasciare (es. 1.21.1-v0.1.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Tutta la storia: serve per controllare che il commit sia in main
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Si rilascia solo ciò che è in main (AGENTS.md, sezione 5): a mano si lancia su main,
      # e un tag mandato da locale deve stare su un commit di main
      - name: Solo da main
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Il workflow Release si lancia su main (lanciato su $GITHUB_REF)"; exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Il commit $(git rev-parse --short HEAD) non è in main"; exit 1
          fi

      - name: Crea il tag (avvio manuale)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9][0-9.]*-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag non valido: $TAG (atteso <versione MC>-vX.Y.Z)"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Il tag $TAG esiste già: i tag di release non si spostano"; exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$TAG" -m "Mango Craft $TAG"
          git push origin "refs/tags/$TAG"

      - name: Leggi il tag
        id: info
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          MC="${TAG%%-v*}"
          VER="${TAG#*-v}"
          PACK="$MC/pack"
          test -f "$PACK/pack.toml" || { echo "Cartella $PACK non trovata"; exit 1; }
          PACKVER=$(sed -nE 's/^version *= *"(.*)"/\1/p' "$PACK/pack.toml")
          if [ "$PACKVER" != "$VER" ]; then
            echo "Il tag ($VER) non corrisponde alla versione in pack.toml ($PACKVER)"
            exit 1
          fi
          {
            echo "mc=$MC"
            echo "ver=$VER"
            echo "pack=$PACK"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/packwiz

      # L'indice nel commit lo scrive packwiz_index.py: packwiz deve dare lo stesso risultato
      - name: Controlli
        env:
          PACK: ${{ steps.info.outputs.pack }}
        run: |
          python3 scripts/check_pack.py "$PACK"
          (cd "$PACK" && packwiz refresh)
          if ! git diff --exit-code --stat -- "$PACK"; then
            echo "::error::L'indice del commit è diverso da quello di packwiz"; exit 1
          fi

      - name: Esporta il .mrpack (solo mod Modrinth)
        env:
          MC: ${{ steps.info.outputs.mc }}
          VER: ${{ steps.info.outputs.ver }}
          PACK: ${{ steps.info.outputs.pack }}
        run: |
          mkdir -p dist
          WORK="$(mktemp -d)"
          cp -r "$PACK"/. "$WORK"/
          # Le mod CurseForge non si possono ridistribuire: fuori dal .mrpack pubblico
          grep -rl --include='*.pw.toml' 'mode = "metadata:curseforge"' "$WORK" | xargs -r rm -v
          (cd "$WORK" && packwiz refresh && packwiz modrinth export -o "$GITHUB_WORKSPACE/dist/mango-craft-$MC-$VER.mrpack")

      - name: Zip della documentazione
        env:
          MC: ${{ steps.info.outputs.mc }}
          VER: ${{ steps.info.outputs.ver }}
        run: |
          zip -qr "dist/mango-craft-$MC-$VER-documenti.zip" README.md AGENTS.md LICENSE docs "$MC/docs" "$MC/lavoro"

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          MC: ${{ steps.info.outputs.mc }}
          VER: ${{ steps.info.outputs.ver }}
          PACK: ${{ steps.info.outputs.pack }}
        run: |
          python3 scripts/release_notes.py "$PACK" "$MC/docs/0401-changelog.md" "$VER" > notes.md
          # Le versioni 0.x escono come pre-release. Il mondo vero parte da una 0.x che supera la soglia
          # (AGENTS.md, sezione 5); la 1.0.0 arriva dopo averci giocato a lungo
          EXTRA=()
          if [[ "$VER" == 0.* ]]; then
            EXTRA=(--prerelease)
            printf '\n> ⚠️ Versione 0.x (pre-release): per il mondo vero usare solo la versione indicata nel piano (soglia del mondo vero).\n' >> notes.md
          fi
          gh release create "$TAG" dist/* --verify-tag "${EXTRA[@]}" --title "Mango Craft $MC · v$VER" --notes-file notes.md
