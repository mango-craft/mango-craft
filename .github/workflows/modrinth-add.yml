name: Aggiungi mod Modrinth

on:
  workflow_dispatch:
    inputs:
      pack:
        description: Cartella del pack
        required: true
        default: 1.21.1/pack
      mods:
        description: "Mod da aggiungere, separate da spazi: slug (ultima release), slug@versione, link alla versione o id di versione"
        required: true

permissions:
  contents: write

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKWIZ_COMMIT: 170b22d785959dda5876b54b7f16e1b807a57fb6

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Installa packwiz
        run: |
          go install "github.com/packwiz/packwiz@${PACKWIZ_COMMIT}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scegli le versioni
        env:
          PACK: ${{ inputs.pack }}
          MODS: ${{ inputs.mods }}
        run: |
          test -f "$PACK/pack.toml" || { echo "Pack non trovato: $PACK"; exit 1; }
          # shellcheck disable=SC2086
          python3 scripts/modrinth_resolve.py "$PACK" $MODS > "$RUNNER_TEMP/scelte.tsv"
          cat "$RUNNER_TEMP/scelte.tsv"

      - name: Aggiungi le mod (con le dipendenze obbligatorie)
        id: add
        env:
          PACK: ${{ inputs.pack }}
        run: |
          # L'output di packwiz va in un file del repository: i log dei workflow
          # non sono leggibili da tutti gli strumenti (es. dallo spazio di lavoro di Claude)
          LOG="$PWD/$(dirname "$PACK")/data/inventario/ultimo-workflow.log"
          mkdir -p "$(dirname "$LOG")"
          echo "Aggiungi mod Modrinth — $(date -u +%F)" > "$LOG"
          cd "$PACK"
          # metafile di mod, resource pack e shader (cartelle diverse)
          find . -name "*.pw.toml" | sort > "$RUNNER_TEMP/prima.txt"
          failed=0
          while IFS=$'\t' read -r id slug ver kind date pid; do
            echo "== $slug $ver ($id)" >> "$LOG"
            # packwiz vuole anche l'id del progetto insieme a quello della versione
            if ! packwiz -y modrinth add --project-id "$pid" --version-id "$id" >> "$LOG" 2>&1; then
              echo "ERRORE: $slug non aggiunta" >> "$LOG"
              failed=1
            fi
          done < "$RUNNER_TEMP/scelte.tsv"
          find . -name "*.pw.toml" | sort > "$RUNNER_TEMP/dopo.txt"
          cat "$LOG"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Indice, controlli, inventario e controllo dei nomi
        id: checks
        env:
          PACK: ${{ inputs.pack }}
        run: |
          status=0
          bash scripts/ci_pack.sh "$PACK" || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Commit
        env:
          PACK: ${{ inputs.pack }}
        run: |
          {
            echo "Scelte (versione, tipo, data):"
            awk -F'\t' '{printf "- %s %s (%s, %s)\n", $2, $3, $4, $5}' "$RUNNER_TEMP/scelte.tsv"
            echo
            echo "Metafile nuovi (comprese le dipendenze):"
            comm -13 "$RUNNER_TEMP/prima.txt" "$RUNNER_TEMP/dopo.txt" | sed 's/^/- /'
          } > "$RUNNER_TEMP/body.txt"
          bash scripts/ci_commit.sh "feat: mod Modrinth aggiunte da GitHub Actions" "$(cat "$RUNNER_TEMP/body.txt")"

      - name: Esito
        if: steps.checks.outputs.status != '0' || steps.add.outputs.failed != '0'
        run: |
          echo "Aggiunte non riuscite: vedi <versione>/data/inventario/ultimo-workflow.log"
          echo "Controlli falliti: vedi <versione>/data/inventario/controllo.md nel ramo"
          exit 1
